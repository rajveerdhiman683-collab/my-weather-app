<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Sun Glow Filter -->
    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Sun Gradients -->
    <radialGradient id="sunGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </radialGradient>

    <!-- Cloud Front Gradient (Emerald/Cyan Glass) -->
    <linearGradient id="cloudFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.95" />
    </linearGradient>

    <!-- Cloud Back Gradient -->
    <linearGradient id="cloudBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#047857" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Ambient Radial Aura -->
  <circle cx="60" cy="60" r="54" fill="#10B981" fill-opacity="0.08" />
  <circle cx="60" cy="60" r="48" fill="none" stroke="#10B981" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Sun Rays & Disc -->
  <g transform="translate(68, 44)">
    <!-- Sun Ray Accents -->
    <line x1="0" y1="-26" x2="0" y2="-21" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    <line x1="18.5" y1="-18.5" x2="15" y2="-15" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    <line x1="26" y1="0" x2="21" y2="0" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    <line x1="18.5" y1="18.5" x2="15" y2="15" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    <line x1="-18.5" y1="-18.5" x2="-15" y2="-15" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    <line x1="-26" y1="0" x2="-21" y2="0" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />

    <!-- Sun Disc -->
    <circle cx="0" cy="0" r="17" fill="url(#sunGrad)" filter="url(#sunGlow)" />
    <circle cx="-4" cy="-4" r="13" fill="#FFF" fill-opacity="0.25" />
  </g>

  <!-- Secondary Background Cloud Curve -->
  <path d="M42 66 C42 56 50 49 59 49 C67 49 73 54 75 61 C77 60 80 59 83 59 C90 59 96 65 96 72 C96 79 90 85 83 85 L42 85 Z"
        fill="url(#cloudBack)" opacity="0.6" filter="url(#glow)" />

  <!-- Primary Foreground Weather Cloud -->
  <g filter="url(#dropShadow)">
    <path d="M 38 78
             A 18 18 0 0 1 54 53
             A 22 22 0 0 1 82 56
             A 17 17 0 0 1 95 72
             A 15 15 0 0 1 86 86
             L 38 86
             A 13 13 0 0 1 38 78 Z"
          fill="url(#cloudFront)" />

    <!-- Glass Cloud Specular Edge / Highlight -->
    <path d="M 38 78
             A 18 18 0 0 1 54 53
             A 22 22 0 0 1 82 56"
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- Sparkle Accent in Emerald Glow -->
  <path d="M 88 32 Q 91 38 97 41 Q 91 44 88 50 Q 85 44 79 41 Q 85 38 88 32 Z"
        fill="#34D399" opacity="0.9" />
  <circle cx="88" cy="41" r="1.5" fill="#FFF" />

  <!-- Raindrop / Energy Beads -->
  <ellipse cx="44" cy="94" rx="2.2" ry="4" transform="rotate(15 44 94)" fill="#38BDF8" opacity="0.85" />
  <ellipse cx="60" cy="95" rx="2.5" ry="4.5" transform="rotate(15 60 95)" fill="#34D399" opacity="0.9" />
  <ellipse cx="76" cy="94" rx="2.2" ry="4" transform="rotate(15 76 94)" fill="#38BDF8" opacity="0.85" />
</svg>
