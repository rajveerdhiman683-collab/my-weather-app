<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="favSun" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EA580C" />
    </radialGradient>
    <linearGradient id="favCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Sun Disc -->
  <circle cx="42" cy="24" r="14" fill="url(#favSun)" />
  <circle cx="42" cy="24" r="17" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />

  <!-- Cloud Body -->
  <path d="M 18 48 
           A 12 12 0 0 1 28 32 
           A 15 15 0 0 1 48 34 
           A 11 11 0 0 1 56 46 
           A 10 10 0 0 1 50 54 
           L 18 54 
           A 9 9 0 0 1 18 48 Z" 
        fill="url(#favCloud)" filter="url(#favGlow)" />

  <!-- Cloud Highlight -->
  <path d="M 18 48 
           A 12 12 0 0 1 28 32 
           A 15 15 0 0 1 48 34" 
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7" />
</svg>
